name: iOS Build/Test Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show Apple Build Environment
      run: |
        swift --version
        xcodebuild -version

    - name: Build iOS Package
      working-directory: ios
      run: xcodebuild -scheme PocketHID -destination 'generic/platform=iOS Simulator' build
